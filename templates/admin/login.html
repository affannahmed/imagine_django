{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagine Assets Management - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #000000 0%, #0a1828 50%, #1a2332 100%);
        }

        /* Animated background particles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(52, 211, 153, 0.1);
            animation: float 20s infinite ease-in-out;
            transition: background 0.5s ease;
        }

        body.dark-mode::before,
        body.dark-mode::after {
            background: rgba(52, 211, 153, 0.05);
        }

        body::before {
            width: 500px;
            height: 500px;
            top: -250px;
            left: -250px;
            animation-delay: 0s;
        }

        body::after {
            width: 400px;
            height: 400px;
            bottom: -200px;
            right: -200px;
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(20deg);
            box-shadow: 0 10px 30px rgba(52, 211, 153, 0.4);
        }

        .theme-toggle:active {
            transform: scale(0.95) rotate(20deg);
        }

        body.dark-mode .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            animation: slideIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        body.dark-mode .login-container {
            background: #1a1f2e;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            padding: 30px 25px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        body.dark-mode .login-header {
            background: linear-gradient(135deg, #000000 0%, #1a2332 100%);
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.15) 0%, transparent 70%);
            animation: pulse 15s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 0.1; }
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .logo-wrapper {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoFloat 4s ease-in-out infinite, logoRotate 20s linear infinite;
            filter: drop-shadow(0 10px 25px rgba(52, 211, 153, 0.4));
            transition: all 0.5s ease;
        }

        body.dark-mode .logo-wrapper {
            filter: drop-shadow(0 10px 30px rgba(52, 211, 153, 0.6));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        @keyframes logoRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.5s ease;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { opacity: 1; filter: brightness(1); }
            50% { opacity: 0.9; filter: brightness(1.2); }
        }

        body.dark-mode .logo {
            filter: brightness(1.3) drop-shadow(0 0 10px rgba(52, 211, 153, 0.5));
        }

        .company-name {
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s ease-out 0.3s both;
            background: linear-gradient(135deg, #ffffff 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tagline {
            color: rgba(52, 211, 153, 0.9);
            font-size: 12px;
            font-weight: 400;
            margin-top: 3px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .login-body {
            padding: 25px 25px 20px;
            background: linear-gradient(to bottom, #ffffff 0%, #f8f9fa 100%);
            transition: background 0.5s ease;
        }

        body.dark-mode .login-body {
            background: linear-gradient(to bottom, #1a1f2e 0%, #151924 100%);
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            transition: color 0.5s ease;
        }

        body.dark-mode label {
            color: #e0e0e0;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            pointer-events: none;
            transition: color 0.3s;
        }

        body.dark-mode .input-icon {
            color: #666;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
            font-family: 'Poppins', sans-serif;
            color: #333;
        }

        body.dark-mode input[type="text"],
        body.dark-mode input[type="password"] {
            background: #252b3d;
            border-color: #3a4158;
            color: #e0e0e0;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #34d399;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
            transform: translateY(-1px);
        }

        body.dark-mode input[type="text"]:focus,
        body.dark-mode input[type="password"]:focus {
            background: #252b3d;
            border-color: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
        }

        input[type="text"]:focus ~ .input-icon,
        input[type="password"]:focus ~ .input-icon {
            color: #34d399;
        }

        body.dark-mode input[type="text"]:focus ~ .input-icon,
        body.dark-mode input[type="password"]:focus ~ .input-icon {
            color: #34d399;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(44, 83, 100, 0.4);
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(52, 211, 153, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .submit-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        body.dark-mode .submit-btn {
            background: linear-gradient(135deg, #000000 0%, #1a2332 100%);
            box-shadow: 0 5px 15px rgba(52, 211, 153, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(52, 211, 153, 0.5);
        }

        body.dark-mode .submit-btn:hover {
            box-shadow: 0 7px 25px rgba(52, 211, 153, 0.6);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .error-message {
            background: linear-gradient(135deg, #fee 0%, #fdd 100%);
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            border-left: 4px solid #c33;
            font-size: 13px;
            box-shadow: 0 3px 8px rgba(204, 51, 51, 0.1);
            animation: shake 0.5s;
            transition: all 0.5s ease;
        }

        body.dark-mode .error-message {
            background: linear-gradient(135deg, #4a1f1f 0%, #3d1a1a 100%);
            color: #ff6b6b;
            border-left-color: #ff6b6b;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .footer {
            text-align: center;
            padding: 20px 25px;
            background: linear-gradient(135deg, #f9fafb, #eef1f6);
            color: #555;
            font-size: 13px;
            border-top: 1px solid #e4e7ec;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.5s ease;
        }

        body.dark-mode .footer {
            background: linear-gradient(135deg, #151924, #0d0f16);
            color: #999;
            border-top-color: #2a2f42;
        }

        .footer .made-with {
            font-weight: 400;
            line-height: 1.8;
            letter-spacing: 0.3px;
        }

        .footer .heart {
            color: #34d399;
            font-size: 18px;
            display: inline-block;
            animation: heartbeat 1.2s ease-in-out infinite;
            margin: 0 3px;
            filter: drop-shadow(0 0 4px rgba(52, 211, 153, 0.4));
        }

        body.dark-mode .footer .heart {
            color: #34d399;
            filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.6));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15%, 45% { transform: scale(1.4); }
            30%, 60% { transform: scale(1); }
        }

        .footer .author {
            font-weight: 700;
            background: linear-gradient(135deg, #0f2027 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 14px;
            display: inline-block;
            margin-left: 3px;
            letter-spacing: 0.6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        body.dark-mode .footer .author {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer .author:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: scale(1.05);
            filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.6));
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                max-width: 350px;
            }

            .company-name {
                font-size: 24px;
            }
            
            .login-body {
                padding: 22px 20px 18px;
            }

            .footer {
                padding: 14px 18px;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .logo-wrapper {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">
        <span id="theme-icon">🌙</span>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-container">
                <div class="logo-wrapper">
                    <img src="/media/assets/cklogo.png" alt="Code Knitters Logo" class="logo" onerror="this.style.display='none'">
                </div>
                <div>
                    <div class="company-name">Code Knitters</div>
                    <div class="tagline">Inspire,        Innovate,       Impact</div>
                </div>
            </div>
        </div>

        <div class="login-body">
            {% if form.errors %}
                <div class="error-message">
                    ⚠️ Please enter the correct username and password.
                </div>
            {% endif %}

            <form method="post" action="{% url 'admin:login' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" id="id_username" required autofocus>
                        <span class="input-icon">★</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="id_password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="id_password" required>
                        <span class="input-icon">●</span>
                    </div>
                </div>

                <input type="hidden" name="next" value="{{ next }}">
                
                <button type="submit" class="submit-btn">
                    <span>LOGIN</span>
                </button>
            </form>
        </div>

        <div class="footer">
            <div class="made-with">
                Made with <span class="heart">♥</span>
            </div>
        </div>
    </div>

    <script>
        // Check for saved theme preference or default to light mode
        const currentTheme = localStorage.getItem('theme') || 'light';
        const themeIcon = document.getElementById('theme-icon');
        
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        // Add ripple effect to button
        const submitBtn = document.querySelector('.submit-btn');
        submitBtn.addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            
            this.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
        });
    </script>
</body>
</html>
